name: Delete All Artifacts

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read id; do
            echo "Deleting artifact $id"
            gh api -X DELETE \
              "/repos/${{ github.repository }}/actions/artifacts/$id"
          done
